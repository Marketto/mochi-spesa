name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Controllo interfaccia (larghezze, temi, axe WCAG 2.2 AA)
        run: node tools/ui-audit.mjs

  deploy:
    needs: [test, ui]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Controllo che non ci siano dati personali
        run: |
          test ! -f config.local.js || (echo "config.local.js non deve essere nel repo" && exit 1)
          node tools/privacy-check.mjs
      - name: Prepara il sito
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons fonts locales vendor _site/
          touch _site/.nojekyll
      - name: Configurazione dal deploy (App key Dropbox da variabile del repo)
        env:
          DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}
        run: |
          # niente ponte nel sito pubblico: ognuno usa il proprio (impostazioni) o config.local.js in locale
          printf 'export default { dropboxAppKey: "%s" };\n' "$DROPBOX_APP_KEY" > _site/config.js
          test -n "$DROPBOX_APP_KEY" || echo "::warning::Variabile DROPBOX_APP_KEY non impostata: l'app chiederà la App key agli utenti"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
      - id: deployment
        uses: actions/deploy-pages@v4
