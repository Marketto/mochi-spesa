name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Controllo che non ci siano dati personali
        run: |
          test ! -f config.local.js || (echo "config.local.js non deve essere nel repo" && exit 1)
          ! grep -rEn "(sk-ant-|sk-or-|sk-proj-|gsk_|sl\.[A-Za-z0-9_-]{20})[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{35}" --include=*.js --include=*.mjs --include=*.html --include=*.json --include=*.md --include=*.toml --include=*.yml --include=*.py --include=*.webmanifest --exclude-dir=node_modules . || (echo "Trovata una chiave API!" && exit 1)
      - name: Prepara il sito
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons fonts locales _site/
          touch _site/.nojekyll
      - name: Configurazione dal deploy (App key Dropbox da variabile del repo)
        env:
          DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}
          FLYER_PROXY: ${{ vars.FLYER_PROXY }}
        run: |
          printf 'export default { dropboxAppKey: "%s", flyerProxy: "%s" };\n' "$DROPBOX_APP_KEY" "$FLYER_PROXY" > _site/config.js
          test -n "$DROPBOX_APP_KEY" || echo "::warning::Variabile DROPBOX_APP_KEY non impostata: l'app chiederà la App key agli utenti"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
