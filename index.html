<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mochi Spesa</title>
<meta name="description" content="Shared, super cute shopping list with Mochi finding deals for you.">
<meta name="theme-color" content="#ffd9e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#241b2a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mochi Spesa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<link rel="preload" href="fonts/mochi-icons.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="a11y.skip">Skip to content</a>

<div class="sky" aria-hidden="true">
  <span>✿</span><span>♡</span><span>✦</span><span>❀</span><span>♡</span><span>✧</span><span>✿</span><span>♡</span>
</div>

<header class="top">
  <div class="mascot-wrap">
    <button class="mascot" id="mascot" type="button" data-i18n-attr="aria-label:a11y.mascot"></button>
    <p class="bubble" id="bubble" aria-hidden="true"></p>
  </div>
  <div class="title">
    <div class="title-row"><h1>Mochi <span data-i18n="app.word">Spesa</span></h1>
      <button class="ver-chip" type="button" id="ver-chip"></button></div>
    <div class="title-row">
      <button class="sync" id="sync" type="button">
        <i class="mi mi-phone" id="sync-ic" aria-hidden="true"></i><span id="sync-txt"></span>
      </button>
      <button class="icon-btn share-btn" type="button" id="share-top" data-i18n-attr="aria-label:share.btn"><i class="mi mi-share" aria-hidden="true"></i></button>
    </div>
  </div>
</header>

<main id="main" tabindex="-1">

  <!-- LISTA -->
  <section id="p-lista" role="tabpanel" aria-labelledby="t-lista" class="panel">
    <div id="install"></div>
    <div id="onboard"></div>
    <form id="f-add" class="add card" autocomplete="off">
      <label for="add-nome" class="sr" data-i18n="list.addLabel"></label>
      <input id="add-nome" name="nome" data-i18n-attr="placeholder:list.addPh" enterkeyhint="done" maxlength="120">
      <button class="btn ghost round mic" type="button" id="mic" hidden aria-pressed="false" data-i18n-attr="aria-label:voice.start"><i class="mi mi-mic" aria-hidden="true"></i></button>
      <button class="btn primary round" type="submit" data-i18n-attr="aria-label:list.addBtn"><i class="mi mi-add" aria-hidden="true"></i></button>
    </form>
    <p class="hint voice-hint" id="voice-msg" aria-live="polite"></p>
    <div class="progress card" id="progress" hidden>
      <div class="pbar" role="progressbar" aria-labelledby="ptxt" aria-valuemin="0" id="pbar"><span id="pfill"></span></div>
      <p id="ptxt"></p>
    </div>
    <div id="home-card"></div>
    <div id="lista"></div>
    <div class="list-actions">
      <button class="btn primary" id="putaway" type="button" hidden><i class="mi mi-home" aria-hidden="true"></i> <span data-i18n="pantry.putAway"></span></button>
      <button class="btn ghost" id="compare" type="button" hidden><i class="mi mi-store" aria-hidden="true"></i> <span data-i18n="cmp.open"></span></button>
      <button class="btn ghost" id="clear-done" type="button" hidden><i class="mi mi-clean" aria-hidden="true"></i> <span data-i18n="list.clear"></span></button>
    </div>
    <p class="hint center swipe-hint" id="swipe-hint" hidden><span data-i18n="list.swipeHint"></span></p>
  </section>

  <!-- DISPENSA -->
  <section id="p-dispensa" role="tabpanel" aria-labelledby="t-dispensa" class="panel" hidden>
    <form id="f-pantry" class="card pantry-add" autocomplete="off">
      <label for="pa-nome" class="sr" data-i18n="pantry.addLabel"></label>
      <input id="pa-nome" data-i18n-attr="placeholder:pantry.addPh" maxlength="120">
      <label for="pa-posto" class="sr" data-i18n="pantry.place"></label>
      <select id="pa-posto"></select>
      <button class="btn primary round" type="submit" data-i18n-attr="aria-label:pantry.addBtn"><i class="mi mi-add" aria-hidden="true"></i></button>
    </form>
    <div class="row wrap gap pantry-tools">
      <fieldset class="seg compact">
        <legend data-i18n="pantry.groupBy"></legend>
        <label><input type="radio" name="pgroup" value="posto" checked> <i class="mi mi-store-room" aria-hidden="true"></i> <span data-i18n="pantry.byPlace"></span></label>
        <label><input type="radio" name="pgroup" value="cat"> <i class="mi mi-cat-pantry" aria-hidden="true"></i> <span data-i18n="pantry.byCat"></span></label>
      </fieldset>
      <button class="btn ghost" type="button" id="places-edit"><i class="mi mi-tab-settings" aria-hidden="true"></i> <span data-i18n="pantry.organize"></span></button>
      <button class="btn ghost" type="button" id="pantry-import"><i class="mi mi-import" aria-hidden="true"></i> <span data-i18n="pantry.import"></span></button>
      <input type="file" id="import-file" accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" hidden>
    </div>
    <div id="pantry"></div>
  </section>

  <!-- OFFERTE -->
  <section id="p-offerte" role="tabpanel" aria-labelledby="t-offerte" class="panel" hidden>
    <h2><i class="mi mi-watch" aria-hidden="true"></i> <span data-i18n="deals.watchTitle"></span></h2>
    <div class="card">
      <form id="f-mon" class="monform" autocomplete="off">
        <label for="mon-nome" class="sr" data-i18n="deals.watchLabel"></label>
        <input id="mon-nome" data-i18n-attr="placeholder:deals.watchPh" maxlength="80">
        <label for="mon-unita" class="sr" data-i18n="deals.unitLabel"></label>
        <select id="mon-unita">
          <option value="lavaggi" data-i18n="unitPer.lavaggi"></option><option value="litri" data-i18n="unitPer.litri"></option>
          <option value="kg" data-i18n="unitPer.kg"></option><option value="pezzi" data-i18n="unitPer.pezzi"></option>
        </select>
        <button class="btn primary round" type="submit" data-i18n-attr="aria-label:deals.watchBtn"><i class="mi mi-watch" aria-hidden="true"></i></button>
      </form>
      <ul class="chips" id="monitor" data-i18n-attr="aria-label:deals.watchTitle"></ul>
    </div>
    <div class="center"><button class="btn primary big" id="cerca" type="button"><i class="mi mi-search" aria-hidden="true"></i> <span data-i18n="deals.search"></span></button></div>
    <div id="away" aria-live="polite"></div>
    <p class="hint" id="off-info" aria-live="polite"></p>
    <div id="free-box"></div>
    <section class="card" aria-labelledby="fl-t">
      <h2 class="in" id="fl-t"><i class="mi mi-scan" aria-hidden="true"></i> <span data-i18n="fl.title"></span> <small data-i18n="zone.shared"></small></h2>
      <p class="hint" data-i18n="fl.hint"></p>
      <button class="btn ghost" type="button" id="ch-refresh" hidden><i class="mi mi-refresh" aria-hidden="true"></i> <span data-i18n="ch.refresh"></span></button>
      <button class="btn ghost" type="button" id="fl-btn"><i class="mi mi-scan" aria-hidden="true"></i> <span data-i18n="fl.load"></span></button>
      <input type="file" id="fl-file" accept="application/pdf,image/*" hidden>
      <progress id="fl-prog" max="1" value="0" hidden data-i18n-attr="aria-label:fl.title"></progress>
      <p class="hint" id="fl-msg" aria-live="polite"></p>
      <h3 class="sub" data-i18n="fl.best"></h3>
      <ul class="fl-best" id="fl-best"></ul>
    </section>
    <div id="offerte"></div>
  </section>

  <!-- VALUTA -->
  <section id="p-valuta" role="tabpanel" aria-labelledby="t-valuta" class="panel" hidden>
    <form class="card" id="f-val" autocomplete="off">
      <h2 class="in"><i class="mi mi-tab-rate" aria-hidden="true"></i> <span data-i18n="rate.title"></span></h2>
      <label for="val-testo" data-i18n="rate.what"></label>
      <input id="val-testo" data-i18n-attr="placeholder:rate.whatPh" inputmode="url">
      <div class="grid2">
        <div><label for="val-prezzo"><span data-i18n="rate.price"></span> (<span class="cur-sym"></span>)</label><input id="val-prezzo" inputmode="decimal" placeholder="12,90"></div>
        <div><label for="val-q" data-i18n="rate.qty"></label><input id="val-q" inputmode="decimal" placeholder="40"></div>
      </div>
      <label for="val-u" data-i18n="rate.unit"></label>
      <select id="val-u">
        <option value="lavaggi" data-i18n="units.lavaggi"></option><option value="litri" data-i18n="units.litri"></option>
        <option value="kg" data-i18n="units.kg"></option><option value="pezzi" data-i18n="units.pezzi"></option>
      </select>
      <div class="row wrap gap">
        <button class="btn ghost" type="button" id="val-calc"><i class="mi mi-calc" aria-hidden="true"></i> <span data-i18n="rate.calc"></span></button>
        <button class="btn primary" type="submit" id="val-ask"><i class="mi mi-mochi" aria-hidden="true"></i> <span data-i18n="rate.ask"></span></button>
      </div>
      <div id="val-out" aria-live="polite"></div>
    </form>
    <h2><i class="mi mi-heart-line" aria-hidden="true"></i> <span data-i18n="rate.history"></span></h2>
    <div id="valutazioni"></div>
  </section>

  <!-- IMPOSTAZIONI -->
  <section id="p-imp" role="tabpanel" aria-labelledby="t-imp" class="panel" hidden>
    <div class="save-bar" id="save-bar" role="region" data-i18n-attr="aria-label:set.unsaved" hidden>
      <span class="save-msg"><i class="mi mi-edit" aria-hidden="true"></i> <span data-i18n="set.unsaved"></span></span>
      <button class="btn ghost" type="button" id="set-cancel"><i class="mi mi-close" aria-hidden="true"></i> <span data-i18n="common.cancel"></span></button>
      <button class="btn primary" type="button" id="set-save"><i class="mi mi-save" aria-hidden="true"></i> <span data-i18n="common.save"></span></button>
    </div>
    <form class="card track" id="f-me">
      <h2 class="in"><i class="mi mi-user" aria-hidden="true"></i> <span data-i18n="me.title"></span></h2>
      <label for="me-lang"><i class="mi mi-lang" aria-hidden="true"></i> <span data-i18n="lang.label"></span></label>
      <select id="me-lang" class="lang-select"></select>
      <label for="me-nome" data-i18n="me.name"></label>
      <input id="me-nome" maxlength="30" autocomplete="given-name">
      <fieldset class="seg">
        <legend data-i18n="anim.legend"></legend>
        <label><input type="radio" name="anim" value="auto"> <i class="mi mi-phone" aria-hidden="true"></i> <span data-i18n="anim.auto"></span></label>
        <label><input type="radio" name="anim" value="on"> <i class="mi mi-magic" aria-hidden="true"></i> <span data-i18n="anim.on"></span></label>
        <label><input type="radio" name="anim" value="off"> <i class="mi mi-heart-line" aria-hidden="true"></i> <span data-i18n="anim.off"></span></label>
      </fieldset>
    </form>

    <form class="card" id="f-dbx">
      <h2 class="in"><i class="mi mi-cloud" aria-hidden="true"></i> <span data-i18n="dbx.title"></span></h2>
      <p class="hint" data-i18n="dbx.hint"></p>
      <details class="adv" id="dbx-adv">
        <summary><i class="mi mi-tab-settings" aria-hidden="true"></i> <span data-i18n="dbx.advanced"></span></summary>
        <div id="dbx-key-wrap">
          <label for="dbx-key" data-i18n="dbx.key"></label>
          <input id="dbx-key" autocomplete="off" spellcheck="false" aria-describedby="dbx-key-h" dir="ltr">
          <p class="hint" id="dbx-key-h" data-i18n="dbx.keyHint"></p>
        </div>
        <label for="dbx-path" data-i18n="dbx.path"></label>
        <input id="dbx-path" spellcheck="false" dir="ltr" placeholder="/Spesa/mochi-spesa.json">
      </details>
      <div class="row wrap gap">
        <button class="btn primary" type="submit" id="dbx-go"><i class="mi mi-connect" aria-hidden="true"></i> <span id="dbx-go-txt"></span></button>
        <button class="btn ghost" type="button" id="dbx-off" hidden><i class="mi mi-disconnect" aria-hidden="true"></i> <span data-i18n="dbx.disconnect"></span></button>
        <button class="btn ghost" type="button" id="dbx-share"><i class="mi mi-copy" aria-hidden="true"></i> <span data-i18n="dbx.share"></span></button>
      </div>
      <p class="hint" id="dbx-msg" aria-live="polite"></p>
    </form>

    <form class="card track" id="f-zona">
      <h2 class="in"><i class="mi mi-pin" aria-hidden="true"></i> <span data-i18n="zone.title"></span> <small data-i18n="zone.shared"></small></h2>
      <label for="z-luogo" data-i18n="zone.place"></label>
      <div class="row gap" style="margin-top:0">
        <input id="z-luogo" data-i18n-attr="placeholder:zone.placePh" autocomplete="off" aria-describedby="geo-msg">
      </div>
      <button class="btn ghost" type="button" id="geo-btn" style="margin-top:8px"><i class="mi mi-pin" aria-hidden="true"></i> <span data-i18n="geo.use"></span></button>
      <p class="hint" id="geo-msg" aria-live="polite"></p>
      <label for="z-raggio"><span data-i18n="zone.radius"></span>: <output id="z-raggio-v" for="z-raggio">5</output> km</label>
      <input id="z-raggio" type="range" min="1" max="30" value="5">
      <label for="z-negozi" data-i18n="zone.shops"></label>
      <input id="z-negozi" data-i18n-attr="placeholder:zone.shopsPh">
      <label for="z-valuta"><i class="mi mi-coins" aria-hidden="true"></i> <span data-i18n="zone.currency"></span></label>
      <select id="z-valuta"></select>
      <label class="check"><input type="checkbox" id="z-amz" checked> <span data-i18n="zone.amazon"></span></label>
      <fieldset class="chains" id="z-chains">
        <legend><i class="mi mi-store" aria-hidden="true"></i> <span data-i18n="ch.title"></span></legend>
        <p class="hint" id="z-chains-hint" data-i18n="ch.hint"></p>
        <div id="z-chains-list"></div>
      </fieldset>
    </form>

    <form class="card track" id="f-lvdir" aria-labelledby="lvdir-t">
      <h2 class="in" id="lvdir-t"><i class="mi mi-shelf" aria-hidden="true"></i> <span data-i18n="tab.pantry"></span> <small data-i18n="zone.shared"></small></h2>
      <fieldset class="seg" id="lvdir">
        <legend data-i18n="pantry.countLevels"></legend>
        <label><input type="radio" name="lvdir" value="alto"> <span data-i18n="pantry.countTop"></span></label>
        <label><input type="radio" name="lvdir" value="basso"> <span data-i18n="pantry.countBottom"></span></label>
      </fieldset>
    </form>
    <section class="card" aria-labelledby="pref-t">
      <h2 class="in" id="pref-t"><i class="mi mi-star" aria-hidden="true"></i> <span data-i18n="pref.title"></span> <small data-i18n="zone.shared"></small></h2>
      <p class="hint" data-i18n="pref.hint"></p>
      <ul class="pref-list" id="pref-list"></ul>
    </section>

    <form class="card track" id="f-ai">
      <h2 class="in"><i class="mi mi-key" aria-hidden="true"></i> <span data-i18n="ai.title"></span></h2>
      <label for="ai-provider" data-i18n="ai.provider"></label>
      <select id="ai-provider"><option value="mistral" data-i18n="ai.pMistral"></option><option value="claude" data-i18n="ai.pClaude"></option></select>
      <p class="hint" id="ai-hint"></p>
      <label for="ai-key" data-i18n="ai.key"></label>
      <input id="ai-key" type="password" autocomplete="off" spellcheck="false" dir="ltr">
      <p class="hint"><a id="ai-link" href="https://console.mistral.ai/api-keys" target="_blank" rel="noopener noreferrer"><i class="mi mi-external" aria-hidden="true"></i> <span data-i18n="ai.getKey"></span><span class="sr" data-i18n="a11y.newTab"></span></a></p>
      <p class="notice" id="ai-shared-msg" hidden><i class="mi mi-heart" aria-hidden="true"></i> <span data-i18n="ai.sharedInUse"></span></p>
      <label class="check"><input type="checkbox" id="ai-share"> <span data-i18n="ai.share"></span></label>
      <p class="hint" data-i18n="ai.shareHint"></p>
      <label for="ai-model" data-i18n="ai.model"></label>
      <input id="ai-model" spellcheck="false" dir="ltr">
    </form>

    <div class="card">
      <h2 class="in"><i class="mi mi-info" aria-hidden="true"></i> <span data-i18n="about.title"></span></h2>
      <p class="hint" id="about-ver"></p>
      <div class="row wrap gap">
        <button class="btn primary" type="button" id="share-app"><i class="mi mi-share" aria-hidden="true"></i> <span data-i18n="share.btn"></span></button>
        <button class="btn ghost" type="button" id="open-legal"><i class="mi mi-privacy" aria-hidden="true"></i> <span data-i18n="legal.open"></span></button>
        <button class="btn ghost" type="button" id="open-news"><i class="mi mi-gift" aria-hidden="true"></i> <span data-i18n="news.open"></span></button>
        <button class="btn ghost" type="button" id="open-wizard"><i class="mi mi-wave" aria-hidden="true"></i> <span data-i18n="wiz.open"></span></button>
      </div>
    </div>
    <p class="hint center" data-i18n="about.footer"></p>
  </section>
</main>

<nav class="tabbar" data-i18n-attr="aria-label:a11y.nav">
  <div role="tablist" data-i18n-attr="aria-label:a11y.nav">
    <button role="tab" id="t-lista" aria-controls="p-lista" aria-selected="true"><i class="mi mi-tab-list" aria-hidden="true"></i><span data-i18n="tab.list"></span></button>
    <button role="tab" id="t-dispensa" aria-controls="p-dispensa" aria-selected="false" tabindex="-1"><i class="mi mi-tab-pantry" aria-hidden="true"></i><span data-i18n="tab.pantry"></span></button>
    <button role="tab" id="t-offerte" aria-controls="p-offerte" aria-selected="false" tabindex="-1"><i class="mi mi-tab-deals" aria-hidden="true"></i><span data-i18n="tab.deals"></span></button>
    <button role="tab" id="t-valuta" aria-controls="p-valuta" aria-selected="false" tabindex="-1"><i class="mi mi-tab-rate" aria-hidden="true"></i><span data-i18n="tab.rate"></span></button>
    <button role="tab" id="t-imp" aria-controls="p-imp" aria-selected="false" tabindex="-1"><i class="mi mi-tab-settings" aria-hidden="true"></i><span data-i18n="tab.settings"></span></button>
  </div>
</nav>

<!-- Conferma -->
<dialog id="dlg" aria-labelledby="dlg-t">
  <form method="dialog">
    <p id="dlg-t"></p>
    <div class="row gap end">
      <button class="btn ghost" value="no"><i class="mi mi-close" aria-hidden="true"></i> <span data-i18n="common.cancel"></span></button>
      <button class="btn primary" value="si"><i class="mi mi-ok" id="dlg-ic" aria-hidden="true"></i> <span id="dlg-ok"></span></button>
    </div>
  </form>
</dialog>

<!-- Finestra generica (quantità, scelte, metti via, confronto, luoghi) -->
<dialog id="sheet" class="big-dlg" aria-labelledby="sheet-t">
  <form method="dialog" id="sheet-form">
    <h2 class="wiz-h" id="sheet-t"></h2>
    <div id="sheet-body"></div>
    <div class="row gap end wrap sheet-btns" id="sheet-btns"></div>
  </form>
</dialog>

<!-- Wizard primo avvio -->
<dialog id="wiz" class="big-dlg" aria-labelledby="wiz-title">
  <div class="wiz-top">
    <div class="wiz-mochi" id="wiz-mochi" aria-hidden="true"></div>
    <ol class="dots" id="wiz-dots" aria-hidden="true"></ol>
    <p class="hint" id="wiz-step"></p>
  </div>
  <h2 class="wiz-h" id="wiz-title" tabindex="-1"></h2>
  <div id="wiz-body" class="wiz-body"></div>
  <div class="row gap wiz-nav">
    <button class="btn ghost" type="button" id="wiz-back"><i class="mi mi-prev" aria-hidden="true"></i> <span data-i18n="wiz.back"></span></button>
    <button class="btn ghost" type="button" id="wiz-skip"><span data-i18n="wiz.skip"></span></button>
    <button class="btn primary" type="button" id="wiz-next"><span id="wiz-next-txt"></span> <i class="mi mi-next" id="wiz-next-ic" aria-hidden="true"></i></button>
  </div>
</dialog>

<!-- Privacy e condizioni d'uso -->
<dialog id="legal" class="big-dlg" aria-labelledby="legal-title">
  <h2 class="wiz-h" id="legal-title"><i class="mi mi-privacy" aria-hidden="true"></i> <span data-i18n="legal.title"></span></h2>
  <div class="legal-body" id="legal-body" tabindex="0" role="region" data-i18n-attr="aria-label:legal.title"></div>
  <form method="dialog" class="row gap end"><button class="btn primary"><i class="mi mi-ok" aria-hidden="true"></i> <span data-i18n="common.close"></span></button></form>
</dialog>

<!-- Novità -->
<dialog id="news" class="big-dlg" aria-labelledby="news-title">
  <div class="news-head" aria-hidden="true"><i class="mi mi-gift"></i></div>
  <h2 class="wiz-h" id="news-title"></h2>
  <div id="news-body"></div>
  <form method="dialog" class="row gap end"><button class="btn primary"><i class="mi mi-party" aria-hidden="true"></i> <span data-i18n="news.ok"></span></button></form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"><i class="mi mi-heart" id="toast-ic" aria-hidden="true"></i> <span id="toast-txt"></span></div>
<div class="fx" id="fx" aria-hidden="true"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
