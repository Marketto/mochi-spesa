<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd9e8"/><stop offset="1" stop-color="#e6dcff"/></linearGradient>
 <linearGradient id="box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5c99a"/><stop offset="1" stop-color="#e9ad74"/></linearGradient>
 <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbd9b4"/><stop offset="1" stop-color="#f0bd88"/></linearGradient>
</defs>
<rect width="512" height="512" rx="112" fill="url(#bg)"/>
<!-- scintille -->
<g fill="#ffffff" opacity=".9">
 <path d="M88 120 l8 -22 l8 22 l22 8 l-22 8 l-8 22 l-8 -22 l-22 -8z"/>
 <path d="M418 96 l6 -16 l6 16 l16 6 l-16 6 l-6 16 l-6 -16 l-16 -6z"/>
 <path d="M430 230 l4 -11 l4 11 l11 4 l-11 4 l-4 11 l-4 -11 l-11 -4z"/>
</g>
<g fill="#ff8fbf"><path d="M74 250 c-8 -10 -24 -2 -16 10 l16 16 l16 -16 c8 -12 -8 -20 -16 -10z"/></g>
<!-- aletta posteriore -->
<path d="M150 300 L190 238 L322 238 L362 300 Z" fill="#d9965c"/>
<!-- Mochi che spunta -->
<g transform="translate(126 70) scale(1.3)">

  <defs>
    <radialGradient id="mBody" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#fff4f7"/>
      <stop offset="100%" stop-color="#ffe1ea"/>
    </radialGradient>
    <radialGradient id="mEye" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6b4a7a"/>
      <stop offset="65%" stop-color="#3a2546"/>
      <stop offset="100%" stop-color="#24152d"/>
    </radialGradient>
  </defs>
  
  <g class="m-all">
    <g class="m-ear m-ear-l">
      <path d="M62 78 C48 40 52 12 66 10 C80 9 86 40 84 74 Z" fill="url(#mBody)" stroke="#e8b7c8" stroke-width="3"/>
      <path d="M66 70 C58 44 60 24 67 22 C74 22 77 44 77 68 Z" fill="#ffc2d6"/>
    </g>
    <g class="m-ear m-ear-r">
